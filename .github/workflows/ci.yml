name: ci

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # bundle/ 是部署真相源（也是唯一的 npm 发布物）；根 scripts 只是委托壳，
      # 因此所有命令都在 bundle/ 里跑，避免再出现"根目录没有 scripts/"这类路径漂移。
      - name: Syntax (host + client + shared validator + feedback loop)
        working-directory: bundle
        run: npm run check
      - name: Tests (embed + fence + feedback + validate + parity + load + client-apply)
        working-directory: bundle
        run: npm test
      - name: Pack self-check (real tarball, --keep)
        working-directory: bundle
        run: node scripts/verify-pack.mjs --keep

  windows-pack:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 必须打 bundle/ 的包（发布物），不是仓库根的 v1 遗留壳。
      - name: Windows syntax + tests
        working-directory: bundle
        run: |
          npm run check
          npm test
      - name: Windows pack (files/exports path + case sanity)
        working-directory: bundle
        run: node scripts/verify-pack.mjs
